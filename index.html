<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nahid TON Wallet</title>

    <!-- TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #263b70 0%, #101522 45%, #080b12 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 25px;
            padding: 28px 20px;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 25px;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aeb7ca;
            font-size: 14px;
            margin-bottom: 25px;
        }

        #ton-connect {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .wallet-box {
            display: none;
            background: rgba(0,0,0,0.25);
            border-radius: 18px;
            padding: 18px;
            margin-top: 15px;
            text-align: left;
        }

        .wallet-box.active {
            display: block;
        }

        .label {
            color: #8994aa;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .address {
            font-size: 13px;
            word-break: break-all;
            line-height: 1.5;
            color: #ffffff;
        }

        .network {
            margin-top: 12px;
            color: #65e6a3;
            font-size: 13px;
        }

        .status {
            margin-top: 20px;
            font-size: 13px;
            color: #9ca8bd;
        }

        .footer {
            margin-top: 22px;
            font-size: 11px;
            color: #69748a;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <img
            src="icon.png"
            class="logo"
            alt="TON Wallet"
        >

        <h1>Nahid TON Wallet</h1>

        <div class="subtitle">
            Connect your TON wallet securely
        </div>

        <!-- TON Connect Button -->
        <div id="ton-connect"></div>

        <!-- Wallet Information -->
        <div id="walletBox" class="wallet-box">

            <div class="label">
                WALLET ADDRESS
            </div>

            <div id="walletAddress" class="address">
                -
            </div>

            <div id="walletNetwork" class="network">
                ● Connected
            </div>

        </div>

        <div id="status" class="status">
            Wallet not connected
        </div>

        <div class="footer">
            Powered by TON Connect
        </div>

    </div>

</div>


<script>

    // ============================================
    // TON CONNECT CONFIGURATION
    // ============================================

    const manifestUrl =
        "https://nahidulxsr-gif.github.io/ton-wallet/tonconnect-manifest.json";


    // Create TON Connect UI
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({

        manifestUrl: manifestUrl,

        buttonRootId: "ton-connect"

    });


    // ============================================
    // ELEMENTS
    // ============================================

    const walletBox =
        document.getElementById("walletBox");

    const walletAddress =
        document.getElementById("walletAddress");

    const walletNetwork =
        document.getElementById("walletNetwork");

    const status =
        document.getElementById("status");


    // ============================================
    // WALLET STATUS
    // ============================================

    tonConnectUI.onStatusChange(function(wallet) {

        if (wallet) {

            console.log("Wallet connected:", wallet);

            // Show wallet box
            walletBox.classList.add("active");

            // Wallet address
            walletAddress.textContent =
                wallet.account.address;

            // Network
            if (wallet.account.chain === "-239") {

                walletNetwork.textContent =
                    "● Connected • TON Mainnet";

            } else if (wallet.account.chain === "-3") {

                walletNetwork.textContent =
                    "● Connected • TON Testnet";

            } else {

                walletNetwork.textContent =
                    "● Connected";

            }

            status.textContent =
                "Wallet successfully connected";

        } else {

            // Wallet disconnected

            walletBox.classList.remove("active");

            walletAddress.textContent = "-";

            walletNetwork.textContent =
                "● Not connected";

            status.textContent =
                "Wallet not connected";

        }

    });


    // ============================================
    // OPTIONAL: GET CURRENT WALLET
    // ============================================

    async function checkWallet() {

        try {

            const wallet =
                tonConnectUI.wallet;

            if (wallet) {

                console.log(
                    "Current wallet:",
                    wallet.account.address
                );

            }

        } catch(error) {

            console.log(error);

        }

    }


    checkWallet();

</script>

</body>
</html>
